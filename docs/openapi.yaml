openapi: "3.0.1"
info:
  title: "smartovate-api"
  version: "1.0"
servers:
- url: "https://k0gyircdq1.execute-api.eu-north-1.amazonaws.com/{basePath}"
  variables:
    basePath:
      default: "prod"
paths:
  /services:
    get:
      security:
      - api_key: []
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/servicemodel"
        required: true
      security:
      - api_key: []
    options:
      responses:
        "200":
          description: "200 response"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Access-Control-Allow-Methods:
              schema:
                type: "string"
            Access-Control-Allow-Headers:
              schema:
                type: "string"
          content: {}
  /services/{id}:
    get:
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      security:
      - api_key: []
    put:
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/servicemodel"
        required: true
      security:
      - api_key: []
    delete:
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      security:
      - api_key: []
    options:
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "200 response"
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Access-Control-Allow-Methods:
              schema:
                type: "string"
            Access-Control-Allow-Headers:
              schema:
                type: "string"
          content: {}
components:
  schemas:
    servicemodel:
      required:
      - "categorie"
      - "description"
      - "nom"
      - "prix"
      type: "object"
      properties:
        categorie:
          type: "string"
        prix:
          type: "string"
        description:
          type: "string"
        nom:
          type: "string"
  securitySchemes:
    api_key:
      type: "apiKey"
      name: "x-api-key"
      in: "header"
x-amazon-apigateway-security-policy: "TLS_1_0"
