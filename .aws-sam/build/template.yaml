AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'smartovate-api

  Sample SAM Template for smartovate-api

  '
Globals:
  Function:
    Timeout: 3
Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: '''*'''
        AllowMethods: '''*'''
        AllowHeaders: '''*'''
      Auth:
        UsagePlan:
          CreateUsagePlan: PER_API
      Models:
        ServiceModel:
          type: object
          required:
          - nom
          - description
          - categorie
          - prix
          properties:
            nom:
              type: string
            description:
              type: string
            categorie:
              type: string
            prix:
              type: string
          RequestValidator:
            ValidateBody: true
            ValidateParameters: false
  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CatalogTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  CreateServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        CreateServiceEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyApi
            Path: /services
            Method: post
            RequestModel:
              Model: ServiceModel
              Required: true
            Auth:
              ApiKeyRequired: true
    Metadata:
      SamResourceId: CreateServiceFunction
  GetServicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetServicesFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServicesEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyApi
            Path: /services
            Method: get
            Auth:
              ApiKeyRequired: true
    Metadata:
      SamResourceId: GetServicesFunction
  ManageServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ManageServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServiceEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyApi
            Path: /services/{id}
            Method: get
            Auth:
              ApiKeyRequired: true
        UpdateServiceEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyApi
            Path: /services/{id}
            Method: put
            RequestModel:
              Model: ServiceModel
              Required: true
            Auth:
              ApiKeyRequired: true
        DeleteServiceEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyApi
            Path: /services/{id}
            Method: delete
            Auth:
              ApiKeyRequired: true
    Metadata:
      SamResourceId: ManageServiceFunction
  SwaggerDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
  SwaggerDocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SwaggerDocsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${SwaggerDocsBucket.Arn}/*
