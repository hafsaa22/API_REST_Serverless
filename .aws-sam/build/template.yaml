AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'smartovate-api Sample SAM Template for smartovate-api

  '
Globals:
  Function:
    Timeout: 3
Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CatalogTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HelloWorldFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: CatalogTable
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get
    Metadata:
      SamResourceId: HelloWorldFunction
  CreateServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        CreateServiceEvent:
          Type: Api
          Properties:
            Path: /services
            Method: post
            RestApiId:
              Ref: MyApi
    Metadata:
      SamResourceId: CreateServiceFunction
  GetServicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetServicesFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServicesEvent:
          Type: Api
          Properties:
            Path: /services
            Method: get
            RestApiId:
              Ref: MyApi
    Metadata:
      SamResourceId: GetServicesFunction
  ManageServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ManageServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: get
            RestApiId:
              Ref: MyApi
        UpdateServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: put
            RestApiId:
              Ref: MyApi
        DeleteServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: delete
            RestApiId:
              Ref: MyApi
    Metadata:
      SamResourceId: ManageServiceFunction
