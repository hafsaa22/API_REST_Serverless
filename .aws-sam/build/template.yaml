AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'smartovate-api

  Sample SAM Template for smartovate-api

  '
Globals:
  Function:
    Timeout: 3
Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
    Models:
      ServiceModel:
        type: object
        required:
        - nom
        - description
        - categorie
        - prix
        properties:
          nom:
            type: string
          description:
            type: string
          categorie:
            type: string
          prix:
            type: string
    RequestValidator:
      ValidateBody: true
      ValidateParameters: false
  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CatalogTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  CreateServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServicesEvent:
          Type: Api
          Properties:
            Path: /services
            Method: get
            RestApiId:
              Ref: MyApi
    GetServicesFunction: null
    Metadata:
      SamResourceId: CreateServiceFunction
  ManageServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ManageServiceFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CatalogTable
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - CatalogTable
            - Arn
      Events:
        GetServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: get
            RestApiId:
              Ref: MyApi
        UpdateServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: put
            RestApiId:
              Ref: MyApi
            RequestModel:
              Model: ServiceModel
              Required: true
        DeleteServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: delete
            RestApiId:
              Ref: MyApi
    Metadata:
      SamResourceId: ManageServiceFunction
