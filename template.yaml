AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  smartovate-api
  Sample SAM Template for smartovate-api

Globals:
  Function:
    Timeout: 3

Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API

  Validator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref MyApi
      ValidateRequestBody: true

  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CatalogTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ------- TEST -------- 
  #  HelloWorldFunction:
  #    Type: AWS::Serverless::Function
  #    Properties:
  #      CodeUri: hello_world/
  #      Handler: app.lambda_handler
  #      Runtime: python3.12
  #      Architectures:
  #        - x86_64
  #      Environment:
  #        Variables:
  #          TABLE_NAME: !Ref CatalogTable
  #      Policies:
  #        - DynamoDBCrudPolicy:
  #            TableName: !Ref CatalogTable
  #      Events:
  #        HelloWorld:
  #          Type: Api
  #          Properties:
  #            Path: /hello
  #            Method: get
  # ----------------------

  CreateServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create_service/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref CatalogTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt CatalogTable.Arn

      Events:
        CreateServiceEvent:
          Type: Api
          Properties:
            Path: /services
            Method: post
            RestApiId: !Ref MyApi

  GetServicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: recuperer_services/
      Handler: app.lambda_handler
      Runtime: python3.12
      # --- PROVISIONED CONCURRENCY -----
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1
      # ---------------------------------
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref CatalogTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt CatalogTable.Arn

      Events:
        GetServicesEvent:
          Type: Api
          Properties:
            Path: /services
            Method: get
            RestApiId: !Ref MyApi

  ManageServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: manage_services/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref CatalogTable

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt CatalogTable.Arn

      Events:
        GetServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: get
            RestApiId: !Ref MyApi
        UpdateServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: put
            RestApiId: !Ref MyApi
        DeleteServiceEvent:
          Type: Api
          Properties:
            Path: /services/{id}
            Method: delete
            RestApiId: !Ref MyApi